services:
  excel-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      CMDB_DATABASE_PATH: /data/cmdb.sqlite3
    volumes:
      - cmdb_data:/data
  web:
    build: .
    restart: unless-stopped
    depends_on:
      - excel-api
    ports:
      - "127.0.0.1:${PORT:-8080}:80"

volumes:
  cmdb_data:
