services:
  excel-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      EXCEL_API_TOKEN: "${EXCEL_API_TOKEN:?Set EXCEL_API_TOKEN before deployment}"
  web:
    build: .
    restart: unless-stopped
    depends_on:
      - excel-api
    ports:
      - "127.0.0.1:${PORT:-8080}:80"
